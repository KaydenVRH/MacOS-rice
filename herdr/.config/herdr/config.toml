# herdr configuration
# macOS Dark rice — the same palette and the same keys as ~/dotfiles/tmux and
# ~/dotfiles/kitty.
#
# The outer terminal still owns font, opacity (0.7), blur (40), and cursor
# trail. Herdr inherits all of that; this file only makes its UI palette and
# multiplexing keys match the rest of the desktop.

onboarding = false

# ============================================================
# THEME — Stark, Iron Man holographic (cyan / gold / red on near-black blue)
# ============================================================
# "terminal" keeps the base aligned with the host palette (kitty's #1E1E1E),
# and every UI token below is a macOS dark-mode value: windowBackground #1E1E1E,
# labelColor 85% #DDDDDD, separator #353535, the graphite system accent #8C8C8C.
# The only hue is systemGreen #30D158 — agent state, nothing else.
[theme]
name = "terminal"
auto_switch = false

[theme.custom]
# "reset" lets kitty's 70% opacity + blur show through the UI surfaces.
panel_bg = "reset"
sidebar_bg = "reset"

accent = "#37D8FF"           # reactor cyan
active_row_bg = "#10303C"    # selection, cyan-tinted
selection_bg = "#10303C"

surface0 = "#0B141C"         # inactive tab background
surface1 = "#14222C"         # hover / lighter surface
surface_dim = "#05090F"      # active-tab foreground on the accent
overlay0 = "#4A6B7C"         # muted text + inactive pane borders
overlay1 = "#6E93A6"         # brighter muted text

text = "#CFE9F7"             # kitty foreground
subtext0 = "#A8CBD8"
mauve = "#B07CFF"            # agent names — holo violet
green = "#3DDC97"            # idle / done
yellow = "#C8DCE8"           # working — steel white
red = "#FF4D3D"              # blocked — iron red
blue = "#37A8FF"             # finished notifications
teal = "#37D8FF"             # reactor cyan
peach = "#E6F6FF"

# The same design in light mode, so a future flip is not a rewrite.
[theme.custom.light]
panel_bg = "reset"
sidebar_bg = "reset"
accent = "#5A5A5A"
active_row_bg = "#D5D5D5"
selection_bg = "#D5D5D5"
surface0 = "#E0E0E0"
surface1 = "#D8D8D8"
surface_dim = "#F2F2F2"
overlay0 = "#6E6E6E"
overlay1 = "#4A4A4A"
text = "#262626"
subtext0 = "#4A4A4A"
mauve = "#5A5A5A"
green = "#1B7A32"
yellow = "#6E6E6E"
red = "#1A1A1A"
blue = "#6E6E6E"
teal = "#4F6B5A"
peach = "#5A5A5A"

# ============================================================
# KEYBINDINGS — identical to ~/dotfiles/tmux/tmux.conf (prefix: Ctrl+B)
# ============================================================
[keys]
prefix = "ctrl+b"

# tmux: " split-window -v (stacked) / % split-window -h (side by side) / w beside
split_horizontal = ["prefix+double_quote", "prefix+minus"]
split_vertical = ["prefix+percent", "prefix+v", "prefix+w"]

# tmux: prefix + arrows (repeatable), plus h/j/k/l
focus_pane_left = ["prefix+left", "prefix+h"]
focus_pane_down = ["prefix+down", "prefix+j"]
focus_pane_up = ["prefix+up", "prefix+k"]
focus_pane_right = ["prefix+right", "prefix+l"]

# tmux: c / n / p / & / 1-9 — new, next, previous, kill, goto
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
close_tab = ["prefix+ampersand", "prefix+shift+x"]
switch_tab = "prefix+1..9"

# tmux: z zoom, Space next layout (herdr has no layouts — cycle panes instead)
zoom = "prefix+z"
cycle_pane_next = ["prefix+tab", "prefix+space"]
cycle_pane_previous = "prefix+shift+tab"

# tmux: prefix + Ctrl+arrows resize
resize_pane_left = "prefix+ctrl+left"
resize_pane_right = "prefix+ctrl+right"
resize_pane_up = "prefix+ctrl+up"
resize_pane_down = "prefix+ctrl+down"
resize_mode = "prefix+shift+r"

# tmux: [ copy-mode, r reload, x kill pane, ; last pane
copy_mode = "prefix+["
reload_config = "prefix+r"
close_pane = "prefix+x"
last_pane = "prefix+semicolon"

# Herdr's own navigation, kept out of the keys above.
workspace_picker = "prefix+shift+w"
rename_workspace = "prefix+alt+w"
settings = "prefix+shift+s"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"
goto = "prefix+g"
detach = "prefix+q"
toggle_sidebar = "prefix+b"

# tmux: prefix+s runs the shared fzf script picker in a popup. Same script as
# the tmux binding, so the list cannot drift between the two.
[[keys.command]]
key = "prefix+s"
type = "popup"
command = '"$HOME/dotfiles/scripts/script-picker.sh"'
description = "run a script from ~/dotfiles/scripts"
width = "70%"
height = "60%"

# ============================================================
# UI — match tmux's pane borders and top tab bar
# ============================================================
[ui]
# Keep herdr's sidebar out of the way, like a tab-only workflow.
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

# kitty: border_width 3 with a grey active border, no scrollbars
pane_borders = "always"
pane_outer_borders = true
pane_gaps = true
pane_scrollbars = false

# tmux: status bar at the top showing "#I:#{b:pane_current_path}"
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
prompt_new_tab_name = false
window_title = "{workspace}"

# Herdr's tab labels are numeric, so the cwd rides on the right — the same
# information tmux puts in its window-status format.
tab_bar_right = [
  { type = "command", command = 'basename "$HERDR_ACTIVE_PANE_CWD"', interval_seconds = 1, timeout_seconds = 2 },
]
tab_bar_right_separator = " "

# tmux closes panes without a confirmation prompt
confirm_close = false

# ============================================================
# Notifications — in-app only, no OS popups
# ============================================================
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"
