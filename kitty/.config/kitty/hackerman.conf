# vim:ft=kitty

## name: Hackerman
## author: custom
## license: MIT
## blurb: Matrix green, terminal rain


#: The basic colors

foreground #ddf7ff
background #0b0c16
selection_foreground #0b0c16
selection_background #829dd4

#: Cursor colors

cursor #82fb9c
cursor_text_color #0b0c16

#: URL underline color when hovering with mouse

url_color #829dd4

#: kitty window border colors and terminal bell colors

active_border_color #82fb9c
inactive_border_color #151828
bell_border_color #50f7d4
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #080910
macos_titlebar_color #080910

#: Tab bar colors

active_tab_foreground #0b0c16
active_tab_background #82fb9c
inactive_tab_foreground #2d3450
inactive_tab_background #151828
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #0b0c16
mark1_background #82fb9c
mark2_foreground #0b0c16
mark2_background #829dd4
mark3_foreground #0b0c16
mark3_background #50f7d4

