# vim:ft=kitty

## name: Amethyst Lagoon
## author: custom
## blurb: Purple-focused variant of Blue Lagoon


#: The basic colors

foreground #e8e0f0
background #120e1a
selection_foreground #e8e0f0
selection_background #2a2440


#: Cursor colors

cursor #a78bfa
cursor_text_color #120e1a


#: URL underline color when hovering with mouse

url_color #b8a4f0


#: kitty window border colors and terminal bell colors

active_border_color #a78bfa
inactive_border_color #1e1a2e
bell_border_color #ff8a60
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #120e1a
macos_titlebar_color #120e1a


#: Tab bar colors

active_tab_foreground #120e1a
active_tab_background #a78bfa
inactive_tab_foreground #8a80a0
inactive_tab_background #0d0a14
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #120e1a
mark1_background #a78bfa
mark2_foreground #120e1a
mark2_background #818cf8
mark3_foreground #120e1a
mark3_background #ffd3b6


