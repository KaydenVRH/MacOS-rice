# vim:ft=kitty

## name: Tokyo Night
## author: custom
## license: MIT
## blurb: Neon night blues and violets


#: The basic colors

foreground #c0caf5
background #1a1b26
selection_foreground #1a1b26
selection_background #7aa2f7

#: Cursor colors

cursor #7aa2f7
cursor_text_color #1a1b26

#: URL underline color when hovering with mouse

url_color #7aa2f7

#: kitty window border colors and terminal bell colors

active_border_color #7aa2f7
inactive_border_color #292e42
bell_border_color #e0af68
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #16161e
macos_titlebar_color #16161e

#: Tab bar colors

active_tab_foreground #1a1b26
active_tab_background #7aa2f7
inactive_tab_foreground #565f89
inactive_tab_background #292e42
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #7aa2f7
mark3_foreground #1a1b26
mark3_background #e0af68

