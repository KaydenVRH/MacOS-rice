## blurb: Nature-inspired — muted greens, warm earth tones, dark forest bg


#: The basic colors

foreground #d3c6aa
background #2d353b
selection_foreground #d3c6aa
selection_background #4c5155


#: Cursor colors

cursor #83c092
cursor_text_color #2d353b


#: URL underline color when hovering with mouse

url_color #7fbbb3


#: kitty window border colors and terminal bell colors

active_border_color #83c092
inactive_border_color #232a2e
bell_border_color #e67e80
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #2d353b
macos_titlebar_color #2d353b


#: Tab bar colors

active_tab_foreground #2d353b
active_tab_background #83c092
inactive_tab_foreground #859289
inactive_tab_background #232a2e
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

