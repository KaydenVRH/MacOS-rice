# vim:ft=kitty

## name: Monochrome Light
## author: custom
## license: MIT
## blurb: Clean light grey, twin of Monochrome


#: The basic colors

foreground #000000
background #ffffff
selection_foreground #ffffff
selection_background #1a1a1a

#: Cursor colors

cursor #6e6e6e
cursor_text_color #ffffff

#: URL underline color when hovering with mouse

url_color #1a1a1a

#: kitty window border colors and terminal bell colors

active_border_color #6e6e6e
inactive_border_color #e8e8e8
bell_border_color #4a4a4a
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #f5f5f5
macos_titlebar_color #f5f5f5

#: Tab bar colors

active_tab_foreground #ffffff
active_tab_background #6e6e6e
inactive_tab_foreground #808080
inactive_tab_background #e8e8e8
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #ffffff
mark1_background #6e6e6e
mark2_foreground #ffffff
mark2_background #1a1a1a
mark3_foreground #ffffff
mark3_background #4a4a4a

#: The basic 16 colors

#: black
color0 #000000
color8 #808080

#: red
color1 #2a2a2a
color9 #2a2a2a

#: green
color2 #3a3a3a
color10 #3a3a3a

#: yellow
color3 #4a4a4a
color11 #4a4a4a

#: blue
color4 #1a1a1a
color12 #1a1a1a

#: magenta
color5 #2e2e2e
color13 #2e2e2e

#: cyan
color6 #3e3e3e
color14 #3e3e3e

#: white
color7 #ffffff
color15 #ffffff
