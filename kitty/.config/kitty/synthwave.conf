# vim:ft=kitty

## name: Synthwave
## author: custom
## license: MIT
## blurb: synthwave/outrun inspired theme


#: The basic colors

foreground #e0d0f0
background #100018
selection_foreground #e0d0f0
selection_background #3a0050


#: Cursor colors

cursor #ff2a85
cursor_text_color #100018


#: URL underline color when hovering with mouse

url_color #00d4ff


#: kitty window border colors and terminal bell colors

active_border_color #ff2a85
inactive_border_color #2a0038
bell_border_color #ffb347
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #1a0028
macos_titlebar_color #1a0028


#: Tab bar colors

active_tab_foreground #ff2a85
active_tab_background #1a0028
inactive_tab_foreground #9a80aa
inactive_tab_background #100018
tab_bar_background #100018
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #100018
mark1_background #ff2a85
mark2_foreground #100018
mark2_background #00d4ff
mark3_foreground #100018
mark3_background #ffb347


#: The basic 16 colors

#: black
color0 #100018
color8 #3a0050

#: red
color1 #ff2a85
color9 #ff6ba5

#: green
color2 #00d4ff
color10 #66e3ff

#: yellow
color3 #ffb347
color11 #ffc773

