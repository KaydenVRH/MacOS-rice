# vim:ft=kitty

## name: Solarized Light
## author: custom (palette from dfrico/omarchy-solarized-light-theme)
## license: MIT
## blurb: Ethan Schoonover's paper daylight, blue and orange


#: The basic colors

foreground #586e75
background #fdf6e3
selection_foreground #fdf6e3
selection_background #268bd2


#: Cursor colors

cursor #268bd2
cursor_text_color #fdf6e3


#: URL underline color when hovering with mouse

url_color #268bd2


#: kitty window border colors and terminal bell colors

active_border_color #268bd2
inactive_border_color #eee8d5
bell_border_color #b58900
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #f5eeda
macos_titlebar_color #f5eeda


#: Tab bar colors

active_tab_foreground #fdf6e3
active_tab_background #268bd2
inactive_tab_foreground #93a1a1
inactive_tab_background #eee8d5
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #fdf6e3
mark1_background #268bd2
mark2_foreground #fdf6e3
mark2_background #cb4b16
mark3_foreground #fdf6e3
mark3_background #2aa198


