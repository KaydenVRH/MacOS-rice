# vim:ft=kitty

## name: macOS Dark
## author: custom
## license: MIT
## blurb: Apple's dark-mode greys, one green accent — window #1E1E1E, label 85%

#: The basic colors
#: Background and label are macOS's windowBackgroundColor and labelColor at 85%,
#: so a kitty window sits next to a Finder window without a seam. Everything
#: else is a grey ramp; the only hue in the palette is systemGreen, used where
#: a terminal needs to point at something.

foreground #dddddd
background #1e1e1e
selection_foreground #ffffff
selection_background #3a3a3a

#: Cursor colors

cursor #8c8c8c
cursor_text_color #1e1e1e

#: URL underline color when hovering with mouse
#: green, because a link is one of the few things worth pointing at

url_color #30d158

#: kitty window border colors and terminal bell colors

active_border_color #8c8c8c
inactive_border_color #353535
bell_border_color #30d158
visual_bell_color none

#: OS Window titlebar colors
#: `system` lets macOS draw its own dark titlebar, which is the whole point.

wayland_titlebar_color system
macos_titlebar_color system

#: Tab bar colors

active_tab_foreground #1e1e1e
active_tab_background #8c8c8c
inactive_tab_foreground #9a9a9a
inactive_tab_background #282828
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #1e1e1e
mark1_background #8c8c8c
mark2_foreground #1e1e1e
mark2_background #30d158
mark3_foreground #1e1e1e
mark3_background #b4b4b4

#: The basic 16 colors
#: A grey ramp ordered by lightness, so `ls --color` and git diffs stay
#: distinguishable without hue. Green keeps its slot; the cyan slot is a
#: desaturated green so "info" is still separable from "success".

#: black
color0 #2a2a2a
color8 #5c5c5c

#: red
color1 #8a8a8a
color9 #a2a2a2

#: green
color2 #30d158
color10 #5ee07f

#: yellow
color3 #9a9a9a
color11 #b4b4b4

#: blue
color4 #787878
color12 #929292

#: magenta
color5 #8f8f8f
color13 #a8a8a8

#: cyan
color6 #7f9a88
color14 #93ad9c

#: white
color7 #dddddd
color15 #ffffff
