# vim:ft=kitty

## name: Fiery Ocean
## author: custom (palette from bjarneo/omarchy-fiery-ocean-theme)
## license: MIT
## blurb: Deep water and ember: teal and orange, nothing muted


#: The basic colors

foreground #fdf0d5
background #002130
selection_foreground #002130
selection_background #fca311


#: Cursor colors

cursor #fca311
cursor_text_color #002130


#: URL underline color when hovering with mouse

url_color #90e0ef


#: kitty window border colors and terminal bell colors

active_border_color #fca311
inactive_border_color #00364f
bell_border_color #e63946
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #001a26
macos_titlebar_color #001a26


#: Tab bar colors

active_tab_foreground #002130
active_tab_background #fca311
inactive_tab_foreground #59696a
inactive_tab_background #001a26
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #002130
mark1_background #fca311
mark2_foreground #002130
mark2_background #90e0ef
mark3_foreground #002130
mark3_background #e63946


