# vim:ft=kitty

## name: One Dark
## author: custom
## license: MIT
## blurb: Atom's balanced dark


#: The basic colors

foreground #abb2bf
background #282c34
selection_foreground #282c34
selection_background #61afef

#: Cursor colors

cursor #61afef
cursor_text_color #282c34

#: URL underline color when hovering with mouse

url_color #61afef

#: kitty window border colors and terminal bell colors

active_border_color #61afef
inactive_border_color #3b4048
bell_border_color #e5c07b
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #21252b
macos_titlebar_color #21252b

#: Tab bar colors

active_tab_foreground #282c34
active_tab_background #61afef
inactive_tab_foreground #5c6370
inactive_tab_background #3b4048
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #282c34
mark1_background #61afef
mark2_foreground #282c34
mark2_background #61afef
mark3_foreground #282c34
mark3_background #e5c07b

