# ============================================================
# THEME
# ============================================================
# BEGIN_KITTY_THEME
# Bi — deep midnight blue-purple, vibrant blue/purple/magenta
include bi.conf
# END_KITTY_THEME

# Tab bar overrides
tab_bar_style            powerline
tab_bar_min_tabs         2
tab_title_template       "{tab.active_wd.rsplit('/', 1)[-1]}"
tab_bar_edge             top
