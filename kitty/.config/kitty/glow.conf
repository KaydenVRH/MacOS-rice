# vim:ft=kitty

## name: Glow
## author: custom
## blurb: Blue lagoon with a purple glow


#: The basic colors

foreground #e6e8f4
background #0c0e18
selection_foreground #e6e8f4
selection_background #262040


#: Cursor colors

cursor #8a8ff8
cursor_text_color #0c0e18


#: URL underline color when hovering with mouse

url_color #8aa4f0


#: kitty window border colors and terminal bell colors

active_border_color #8a8ff8
inactive_border_color #171a2e
bell_border_color #ff8a60
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #0c0e18
macos_titlebar_color #0c0e18


#: Tab bar colors

active_tab_foreground #0c0e18
active_tab_background #8a8ff8
inactive_tab_foreground #868aa4
inactive_tab_background #080a12
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #0c0e18
mark1_background #8a8ff8
mark2_foreground #0c0e18
mark2_background #a0a4ff
mark3_foreground #0c0e18
mark3_background #ffd3b6


