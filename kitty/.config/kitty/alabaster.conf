# vim:ft=kitty

## name: Alabaster
## author: custom (palette from grierson/omarchy-alabaster-theme (tonsky's Alabaster))
## license: MIT
## blurb: Tonsky's quiet light: off-white paper, ink text, one clear blue


#: The basic colors

foreground #434343
background #F7F7F7
selection_foreground #F7F7F7
selection_background #325CC0


#: Cursor colors

cursor #325CC0
cursor_text_color #F7F7F7


#: URL underline color when hovering with mouse

url_color #325CC0


#: kitty window border colors and terminal bell colors

active_border_color #325CC0
inactive_border_color #E4E4E4
bell_border_color #CB9000
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #EDEDED
macos_titlebar_color #EDEDED


#: Tab bar colors

active_tab_foreground #F7F7F7
active_tab_background #325CC0
inactive_tab_foreground #999999
inactive_tab_background #E4E4E4
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #F7F7F7
mark1_background #325CC0
mark2_foreground #F7F7F7
mark2_background #7A3E9D
mark3_foreground #F7F7F7
mark3_background #CB9000


