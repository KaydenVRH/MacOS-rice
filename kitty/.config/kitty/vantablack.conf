# vim:ft=kitty

## name: Vantablack
## author: custom
## license: MIT
## blurb: Pure black, not a photon spared


#: The basic colors

foreground #ffffff
background #000000
selection_foreground #000000
selection_background #8d8d8d

#: Cursor colors

cursor #8d8d8d
cursor_text_color #000000

#: URL underline color when hovering with mouse

url_color #8d8d8d

#: kitty window border colors and terminal bell colors

active_border_color #8d8d8d
inactive_border_color #1a1a1a
bell_border_color #cecece
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #0a0a0a
macos_titlebar_color #0a0a0a

#: Tab bar colors

active_tab_foreground #000000
active_tab_background #8d8d8d
inactive_tab_foreground #7a7a7a
inactive_tab_background #1a1a1a
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #000000
mark1_background #8d8d8d
mark2_foreground #000000
mark2_background #8d8d8d
mark3_foreground #000000
mark3_background #cecece

