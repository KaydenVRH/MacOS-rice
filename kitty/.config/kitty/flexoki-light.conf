# vim:ft=kitty

## name: Flexoki Light
## author: custom
## license: MIT
## blurb: Warm paper light, ink dark


#: The basic colors

foreground #100f0f
background #fffcf0
selection_foreground #fffcf0
selection_background #205ea6

#: Cursor colors

cursor #205ea6
cursor_text_color #fffcf0

#: URL underline color when hovering with mouse

url_color #205ea6

#: kitty window border colors and terminal bell colors

active_border_color #205ea6
inactive_border_color #e6e4d9
bell_border_color #d0a215
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #f2efe4
macos_titlebar_color #f2efe4

#: Tab bar colors

active_tab_foreground #fffcf0
active_tab_background #205ea6
inactive_tab_foreground #b7b5ac
inactive_tab_background #e6e4d9
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #fffcf0
mark1_background #205ea6
mark2_foreground #fffcf0
mark2_background #205ea6
mark3_foreground #fffcf0
mark3_background #d0a215

