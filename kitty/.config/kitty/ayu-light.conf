# vim:ft=kitty

## name: Ayu Light
## author: custom (palette from fdidron/omarchy-ayu-light-theme)
## license: MIT
## blurb: Ayu's bright daylight: warm orange over cool paper


#: The basic colors

foreground #5c6166
background #f8f9fa
selection_foreground #5c6166
selection_background #d3e1f5


#: Cursor colors

cursor #fa8d3e
cursor_text_color #f8f9fa


#: URL underline color when hovering with mouse

url_color #3199e1


#: kitty window border colors and terminal bell colors

active_border_color #fa8d3e
inactive_border_color #e8ebee
bell_border_color #ea6c6d
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #eef0f2
macos_titlebar_color #eef0f2


#: Tab bar colors

active_tab_foreground #f8f9fa
active_tab_background #fa8d3e
inactive_tab_foreground #9aa0a6
inactive_tab_background #e8ebee
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #f8f9fa
mark1_background #fa8d3e
mark2_foreground #f8f9fa
mark2_background #3199e1
mark3_foreground #f8f9fa
mark3_background #46ba94


