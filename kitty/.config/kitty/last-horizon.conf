# vim:ft=kitty

## name: Last Horizon
## author: custom
## license: MIT
## blurb: Moody monochrome, a rose horizon


#: The basic colors

foreground #fafcfb
background #0c0b0c
selection_foreground #0c0b0c
selection_background #b59790

#: Cursor colors

cursor #b59790
cursor_text_color #0c0b0c

#: URL underline color when hovering with mouse

url_color #b59790

#: kitty window border colors and terminal bell colors

active_border_color #b59790
inactive_border_color #1b181a
bell_border_color #6b5e73
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #080707
macos_titlebar_color #080707

#: Tab bar colors

active_tab_foreground #0c0b0c
active_tab_background #b59790
inactive_tab_foreground #584e51
inactive_tab_background #1b181a
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #0c0b0c
mark1_background #b59790
mark2_foreground #0c0b0c
mark2_background #b59790
mark3_foreground #0c0b0c
mark3_background #6b5e73

