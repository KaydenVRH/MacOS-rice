# vim:ft=kitty

## name: Night Lagoon
## author: custom
## blurb: Ultra-deep purple-black, dark lagoon at midnight


#: The basic colors

foreground #e4def0
background #0a0812
selection_foreground #e4def0
selection_background #1e1830


#: Cursor colors

cursor #8c6ad8
cursor_text_color #0a0812


#: URL underline color when hovering with mouse

url_color #b098e8


#: kitty window border colors and terminal bell colors

active_border_color #8c6ad8
inactive_border_color #141026
bell_border_color #ff8a60
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #0a0812
macos_titlebar_color #0a0812


#: Tab bar colors

active_tab_foreground #0a0812
active_tab_background #8c6ad8
inactive_tab_foreground #7a7490
inactive_tab_background #06050c
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #0a0812
mark1_background #8c6ad8
mark2_foreground #0a0812
mark2_background #a080e0
mark3_foreground #0a0812
mark3_background #ffd3b6


