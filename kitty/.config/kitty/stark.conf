# vim:ft=kitty

## name: Stark
## author: custom
## license: MIT
## blurb: Iron Man holographic — arc-reactor cyan on near-black blue, gold readouts

#: The basic colors
#: A holographic HUD: the field is almost black with a blue cast, text is an
#: ice-white blue, and the one hue that carries meaning is reactor cyan. Gold is
#: the readout colour (numbers, URLs), red is reserved for failures.

foreground #cfe9f7
background #05090f
selection_foreground #e6f6ff
selection_background #10303c

#: Cursor colors

cursor #37d8ff
cursor_text_color #05090f

#: URL underline color when hovering with mouse
#: gold, because a link is a readout

url_color #a8e9ff

#: kitty window border colors and terminal bell colors

active_border_color #37d8ff
inactive_border_color #1b2c38
bell_border_color #ff4d3d
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color system
macos_titlebar_color system

#: Tab bar colors

active_tab_foreground #05090f
active_tab_background #37d8ff
inactive_tab_foreground #4a6b7c
inactive_tab_background #0b141c
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #05090f
mark1_background #37d8ff
mark2_foreground #05090f
mark2_background #a8e9ff
mark3_foreground #05090f
mark3_background #ff4d3d

#: The basic 16 colors

#: black
color0 #0b141c
color8 #2a4350

#: red
color1 #ff4d3d
color9 #ff7a6e

#: green
color2 #3ddc97
color10 #6ff0b8

#: yellow
color3 #c8dce8
color11 #eaf6ff

#: blue
color4 #37a8ff
color12 #6fc4ff

#: magenta
color5 #b07cff
color13 #c9a3ff

#: cyan
color6 #37d8ff
color14 #7debff

#: white
color7 #cfe9f7
color15 #ffffff
