# vim:ft=kitty

## name: Cherry Blossom
## author: custom
## license: MIT
## blurb: soft pink cherry blossom inspired theme


#: The basic colors

foreground #f5e6e8
background #1c1116
selection_foreground #f5e6e8
selection_background #3d1f2a


#: Cursor colors

cursor #f8a5c2
cursor_text_color #1c1116


#: URL underline color when hovering with mouse

url_color #c3aedb


#: kitty window border colors and terminal bell colors

active_border_color #f8a5c2
inactive_border_color #2a1520
bell_border_color #ffd3b6
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #1c1116
macos_titlebar_color #1c1116


#: Tab bar colors

active_tab_foreground #f8a5c2
active_tab_background #1c1116
inactive_tab_foreground #a88a92
inactive_tab_background #140a0e
tab_bar_background #140a0e
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #1c1116
mark1_background #f8a5c2
mark2_foreground #1c1116
mark2_background #c3aedb
mark3_foreground #1c1116
mark3_background #ffd3b6


