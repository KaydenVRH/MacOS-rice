# vim:ft=kitty

## name: Rose Pine Dawn
## author: custom
## license: MIT
## blurb: Rose Pine's warm morning light


#: The basic colors

foreground #575279
background #faf4ed
selection_foreground #faf4ed
selection_background #907aa9

#: Cursor colors

cursor #d7827e
cursor_text_color #faf4ed

#: URL underline color when hovering with mouse

url_color #907aa9

#: kitty window border colors and terminal bell colors

active_border_color #d7827e
inactive_border_color #f4ede8
bell_border_color #ea9d34
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #f2e9e1
