# vim:ft=kitty

## name: Lupine
## author: custom
## license: MIT
## blurb: Pale lavender morning


#: The basic colors

foreground #212121
background #fafafa
selection_foreground #fafafa
selection_background #3264eb

#: Cursor colors

cursor #3264eb
cursor_text_color #fafafa

#: URL underline color when hovering with mouse

url_color #3264eb

#: kitty window border colors and terminal bell colors

active_border_color #3264eb
inactive_border_color #f5f5f5
bell_border_color #026fde
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #ececec
macos_titlebar_color #ececec

#: Tab bar colors

active_tab_foreground #fafafa
active_tab_background #3264eb
inactive_tab_foreground #9e9e9e
inactive_tab_background #f5f5f5
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #fafafa
mark1_background #3264eb
mark2_foreground #fafafa
mark2_background #3264eb
mark3_foreground #fafafa
mark3_background #026fde

