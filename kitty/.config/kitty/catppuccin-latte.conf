## blurb: Catppuccin's soft pastel daylight


#: The basic colors

foreground #4c4f69
background #eff1f5
selection_foreground #eff1f5
selection_background #1e66f5

#: Cursor colors

cursor #1e66f5
cursor_text_color #eff1f5

#: URL underline color when hovering with mouse

