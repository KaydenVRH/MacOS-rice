# vim:ft=kitty

## name: Cobalt 2
## author: custom (palette from hoblin/omarchy-cobalt2-theme)
## license: MIT
## blurb: Cobalt blue with a yellow cursor and neon syntax


#: The basic colors

foreground #ffffff
background #122738
selection_foreground #122738
selection_background #0088ff


#: Cursor colors

cursor #ffc600
cursor_text_color #122738


#: URL underline color when hovering with mouse

url_color #80fcff


#: kitty window border colors and terminal bell colors

active_border_color #ffc600
inactive_border_color #1b3a52
bell_border_color #ff628c
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #122738
macos_titlebar_color #122738


#: Tab bar colors

active_tab_foreground #122738
active_tab_background #ffc600
inactive_tab_foreground #7fa4bd
inactive_tab_background #0c1b27
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #122738
mark1_background #ffc600
mark2_foreground #122738
mark2_background #80fcff
mark3_foreground #122738
mark3_background #3ad900


#: The basic 16 colors

#: black
color0 #122738
color8 #0050a4

#: red
color1 #ff628c
color9 #ff628c

#: green
color2 #3ad900
color10 #3ad900

#: yellow
color3 #ffc600
color11 #ffc600

#: blue
color4 #0088ff
color12 #0088ff

#: magenta
color5 #fb94ff
color13 #fb94ff

#: cyan
color6 #80fcff
color14 #80fcff

#: white
color7 #ffffff
