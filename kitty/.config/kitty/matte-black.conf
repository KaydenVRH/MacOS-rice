# vim:ft=kitty

## name: Matte Black
## author: custom
## license: MIT
## blurb: Black matte, a single amber spark


#: The basic colors

foreground #bebebe
background #121212
selection_foreground #121212
selection_background #e68e0d

#: Cursor colors

cursor #e68e0d
cursor_text_color #121212

#: URL underline color when hovering with mouse

url_color #e68e0d

#: kitty window border colors and terminal bell colors

active_border_color #e68e0d
inactive_border_color #1e1e1e
bell_border_color #b91c1c
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #0d0d0d
macos_titlebar_color #0d0d0d

#: Tab bar colors

active_tab_foreground #121212
active_tab_background #e68e0d
inactive_tab_foreground #333333
inactive_tab_background #1e1e1e
tab_bar_background none
tab_bar_margin_color none

#: Colors for marks (marked text in the terminal)

mark1_foreground #121212
mark1_background #e68e0d
mark2_foreground #121212
mark2_background #e68e0d
mark3_foreground #121212
mark3_background #b91c1c

