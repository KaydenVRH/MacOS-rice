# vim:ft=kitty

## name: Void
## author: custom (palette from vyrx-dev/omarchy-void-theme)
## license: MIT
## blurb: Almost no black at all: violet light in an empty room


#: The basic colors

foreground #FFFFFF
background #05010C
selection_foreground #05010C
selection_background #BB9AF7


#: Cursor colors

cursor #814DDE
cursor_text_color #05010C


#: URL underline color when hovering with mouse

url_color #A6B8FF


#: kitty window border colors and terminal bell colors

active_border_color #BB9AF7
inactive_border_color #241a3a
bell_border_color #F07178
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #05010C
macos_titlebar_color #05010C


#: Tab bar colors

active_tab_foreground #05010C
active_tab_background #BB9AF7
inactive_tab_foreground #6B578F
inactive_tab_background #0d0818
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #05010C
mark1_background #BB9AF7
mark2_foreground #05010C
mark2_background #A6B8FF
mark3_foreground #05010C
mark3_background #F07178


#: The basic 16 colors

#: black
color0 #382952
color8 #6B578F

#: red
color1 #F07178
color9 #FF8A95

#: green
color2 #C2B8FF
color10 #B3A8F7

#: yellow
color3 #DDCCFF
color11 #D1BFF7

#: blue
color4 #BB9AF7
color12 #CBA6F8

#: magenta
color5 #B49AE6
color13 #C4AAF0

#: cyan
color6 #A6B8FF
color14 #C2CCFF

