# vim:ft=kitty

## name: Azure Glow
## author: custom (palette from Hydradevx/omarchy-azure-glow-theme)
## license: MIT
## blurb: One hue, every shade of it: neon azure on deep water


#: The basic colors

foreground #a8dfff
background #0a0f1a
selection_foreground #0a0f1a
selection_background #00aaff


#: Cursor colors

cursor #00ccff
cursor_text_color #0a0f1a


#: URL underline color when hovering with mouse

url_color #66e0ff


#: kitty window border colors and terminal bell colors

active_border_color #00ccff
inactive_border_color #123247
bell_border_color #33ffdd
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #0a0f1a
macos_titlebar_color #0a0f1a


#: Tab bar colors

active_tab_foreground #0a0f1a
active_tab_background #00ccff
inactive_tab_foreground #4a6b80
inactive_tab_background #0d1b26
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #0a0f1a
mark1_background #00ccff
mark2_foreground #0a0f1a
mark2_background #66e0ff
mark3_foreground #0a0f1a
mark3_background #33ffdd


#: The basic 16 colors

#: black
color0 #0d1b26
color8 #123247

#: red
color1 #0099cc
color9 #33ccff

#: green
color2 #00e0b8
color10 #33ffdd

#: yellow
color3 #33ccff
color11 #66ddff

#: blue
color4 #00aaff
color12 #33bbff

#: magenta
color5 #3399ff
color13 #66b2ff

#: cyan
color6 #66e0ff
color14 #99eeff

#: white
color7 #cceeff
color15 #ffffff
