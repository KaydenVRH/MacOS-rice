# vim:ft=kitty

## name: Vice City
## author: custom (palette from lavarinimoreira/omarchy-vice-city-theme)
## license: MIT
## blurb: Miami neon: hot pink, electric cyan, moonlight blue


#: The basic colors

foreground #f793d9
background #0a0a14
selection_foreground #0a0a14
selection_background #ff6ec7


#: Cursor colors

cursor #f793d9
cursor_text_color #0a0a14


#: URL underline color when hovering with mouse

url_color #00a8ff


#: kitty window border colors and terminal bell colors

active_border_color #ff6ec7
inactive_border_color #241733
bell_border_color #ffff00
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #0a0a14
macos_titlebar_color #0a0a14


#: Tab bar colors

