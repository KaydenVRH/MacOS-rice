# vim:ft=kitty

## name: Blue Lagoon
## author: custom
## license: MIT
## blurb: soft blue cute theme


#: The basic colors

foreground #e8f0f8
background #0e1419
selection_foreground #e8f0f8
selection_background #1a2a38


#: Cursor colors

cursor #89cff0
cursor_text_color #0e1419


#: URL underline color when hovering with mouse

url_color #6ba3ff


#: kitty window border colors and terminal bell colors

active_border_color #89cff0
inactive_border_color #14222e
bell_border_color #ffd3b6
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #0e1419
macos_titlebar_color #0e1419


#: Tab bar colors

active_tab_foreground #0e1419
active_tab_background #6ba3ff
inactive_tab_foreground #8ba0b0
inactive_tab_background #141e28
tab_bar_background none
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #0e1419
mark1_background #89cff0
mark2_foreground #0e1419
mark2_background #6ba3ff
mark3_foreground #0e1419
mark3_background #ffd3b6


