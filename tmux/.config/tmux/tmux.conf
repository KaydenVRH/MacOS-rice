# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Prefix is § (key left of 1), double-tap to type §
set -g prefix "§"
bind-key "§" send-prefix
set -g prefix2 C-b

# Set default terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Mouse support
set -g mouse on

# Allow Kitty graphics protocol (icat, etc.) to pass through tmux
set -g allow-passthrough on
set -ga terminal-overrides ",xterm-kitty:Tc"

# Night Lagoon (ultra-deep purple-black)
BI_PURPLE=#8c6ad8
BI_BLUE=#a080e0
BI_MAGENTA=#c084fc
BI_PINK=#b098e8
BI_TEAL=#b098e8
BI_BG=#0a0812
BI_BG2=#141026
BI_FG=#e4def0
BI_FG2=#7a7490

# Status bar
set -g status-interval 1
set -g status-position top
set -g status-style "bg=default,fg=$BI_FG"

set -g status-left-length 60
set -g status-left-length 60
set -g status-left "#[fg=$BI_PURPLE,bg=default]#[bg=$BI_PURPLE,fg=$BI_BG] #{b:pane_current_path} #[fg=$BI_PURPLE,bg=default]"

set -g status-right-length 120
set -g status-right "#(tmux display -p '#{?client_prefix,#[fg=$BI_PURPLE,bg=default]#[bg=$BI_PURPLE,fg=$BI_BG] PREFIX #[fg=$BI_PURPLE,bg=default],}')#[fg=$BI_PURPLE,bg=default]#[bg=$BI_PURPLE,fg=$BI_BG] #h #[fg=$BI_PURPLE,bg=default]"

# Windows
set -wg window-status-format "#[fg=$BI_BG2,bg=default]#[bg=$BI_BG2,fg=$BI_FG2] #W #[fg=$BI_BG2,bg=default]"
set -wg window-status-current-format "#[fg=$BI_PURPLE,bg=default]#[bg=$BI_PURPLE,fg=$BI_BG] #W #[fg=$BI_PURPLE,bg=default]"
set -wg window-status-separator ""
set -g status-justify left

# Pane border
set -wg pane-border-style "fg=$BI_BG2"
set -wg pane-active-border-style "fg=$BI_PURPLE"

# Messages
set -g message-style "bg=$BI_PURPLE,fg=$BI_BG"
set -g message-command-style "bg=$BI_PURPLE,fg=$BI_BG"

# Popup styling
set -gF popup-style "bg=default,fg=$BI_FG2"
set -gF popup-border-style "fg=$BI_PURPLE"

# Vi-style copy mode
set -g mode-keys vi

# Reduce escape delay (fixes vim/nvim lag)
set -sg escape-time 0

# Focus events (useful for vim autosave, etc.)
set -g focus-events on

# History limit
set -g history-limit 50000

###############################################################################
# KEYBINDINGS
###############################################################################

# Reload config with prefix + r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Better splits (| and - instead of " and %)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key _ split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation (prefix + h/j/k/l)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-like resize (prefix + H/J/K/L)
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# Quick pane swap (prefix + < and >)
bind-key < swap-pane -D
bind-key > swap-pane -U

# Zoom pane (prefix + z is default, keep it)
# Kill pane without confirmation (prefix + x asks for confirmation, keep default)

# Sessionizer (prefix + f) — fuzzy-find projects
bind-key f display-popup -w 80% -h 80% ~/.local/bin/sessionizer

# Popup terminal (prefix + /) — scratchpad in center
bind-key / display-popup -w 80% -h 80% -d "#{pane_current_path}"

# Popup smaller (prefix + g) — quick command runner
bind-key g display-popup -w 60% -h 50% -d "#{pane_current_path}"

# Enter copy mode with Enter/Scroll, yank with y
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
