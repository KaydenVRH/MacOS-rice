# tmux — mirrors the kitty multiplexing bindings in ~/.config/kitty/kitty.conf
#
# Same prefix (Ctrl+B), same keys, same jobs: splits, pane movement, tabs,
# layouts, zoom, scrollback, reload, and the fzf script picker. Anything that
# only makes sense inside kitty (background_opacity, launch --location=neighbor)
# has the closest tmux equivalent here and says so.
#
# Colours are NOT set in this file. `tmux-theme.sh` writes theme.conf from the
# active kshell theme and this file sources it last, so a theme switch repaints
# tmux the same way it repaints kitty.

# ── shell / terminal ────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# default-command is left alone: tmux expands no shell syntax here, and the
# login shell it inherits is already the right one.
# kitty advertises true colour; without this tmux downsamples it to 256.
set -as terminal-features ",xterm-kitty:RGB:sync"
set -as terminal-overrides ",xterm-kitty:Tc"
# ked's inline images and any other kitty-graphics output pass through.
set -g allow-passthrough on
# No delay before a key is delivered — vim and ked feel immediate.
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on

# ── prefix ─────────────────────────────────────────────────────────────────
# kitty's maps are `ctrl+b>` — same prefix, so muscle memory carries over.
set -g prefix C-b
unbind C-b
bind C-b send-prefix
set -g repeat-time 300

# ── splits (kitty: ctrl+b>" and ctrl+b>%) ──────────────────────────────────
# kitty's `"` is hsplit (stacked) and `%` is vsplit (side by side) — the
# opposite of tmux's defaults, so both are bound explicitly to match.
unbind '"'
unbind %
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
# kitty: launch --location=neighbor. tmux has no "next to this one" that is not
# already a split, so `w` opens a pane beside this one, in the current directory.
bind w split-window -h -c "#{pane_current_path}"

# ── pane movement (kitty: neighboring_window left/right/up/down) ───────────
bind -r Left  select-pane -L
bind -r Right select-pane -R
bind -r Up    select-pane -U
bind -r Down  select-pane -D
# and the vim keys, for when the fingers are already there
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── resize (kitty: resize_window narrower/wider/taller/shorter) ────────────
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up    resize-pane -U 5
bind -r C-Down  resize-pane -D 5

# ── tabs (kitty: new_tab / next_tab / previous_tab / close_tab / goto_tab) ─
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind & kill-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
# 1-based like kitty's tab bar, and windows renumber as they close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── layout / zoom (kitty: next_layout, toggle_fullscreen) ──────────────────
bind Space next-layout
bind z resize-pane -Z
# `M-1..5` pick a layout outright; kitty only cycles, this is strictly more.
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ── scrollback (kitty: show_scrollback) ────────────────────────────────────
bind [ copy-mode
setw -g mode-keys vi
set -g history-limit 50000
# wheel scrolls the pane under the pointer, like a terminal does
set -g mouse on

# ── reload (kitty: load_config_file) ──────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── script picker (kitty: fzf overlay over ~/dotfiles/scripts) ─────────────
bind s display-popup -E -w 70% -h 60% -T " scripts " "$HOME/dotfiles/scripts/script-picker.sh"

# ── sessions (no kitty equivalent; kitty has no session model) ────────────
bind C-s command-prompt -p "new session:" "new-session -s '%%'"
bind S choose-tree -Zs

# ── status bar: kitty's tab bar, moved into tmux ──────────────────────────
# kitty had it at the top with powerline tabs showing the active directory.
set -g status-position top
set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 80
set -g status-justify left
# Structural formats only — theme.conf fills in the colours.
set -g status-left  " #S "
set -g status-right " #{?window_zoomed_flag,[Z] ,}#{b:pane_current_path} "
set -g window-status-format         " #I:#{b:pane_current_path} "
set -g window-status-current-format " #I:#{b:pane_current_path} "
set -g window-status-separator ""
# Pane borders, matching kitty's border_width 3.
set -g pane-border-lines single
set -g pane-border-indicators colour

# ── theme ─────────────────────────────────────────────────────────────────
# Written by ~/dotfiles/scripts/tmux-theme.sh from the active kshell theme.
# -q so a missing file is not an error on a fresh machine.
source-file -q ~/.config/tmux/theme.conf
